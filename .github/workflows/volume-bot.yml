# Tr volume bot — runs every 2 hours, free, on GitHub Actions.
#
# Setup (the user does this once, in the GitHub web UI):
#   1. Create a repo (public = unlimited free minutes; private also fits:
#      this bot uses ~360 min/month of the 2,000 free minutes).
#      Suggested name: tr-volume-bot
#   2. Upload bot.py + requirements.txt + subscribers.json + this .github
#      folder.
#   3. Repo -> Settings -> Secrets and variables -> Actions -> New secret:
#        BOT_TOKEN   = the bot token from BotFather (paste ONLY here, never
#                      in chat or in a file)
#        LCW_API_KEY = a free Live Coin Watch API key (paste ONLY here)
#        CHAT_ID     = optional seed chat (subscribed even without /start)
#   4. Actions tab -> "Tr volume bot" -> Run workflow (test run).
#
# How it works: anyone who /starts the bot in Telegram gets the digest.
# Each run polls getUpdates for new /start commands, adds those chats to
# subscribers.json, sends the digest to every subscriber, and commits the
# updated list back. The bot has NO webhook (deleteWebhook) — a webhook
# would swallow the /start updates, so getUpdates would see nothing.
# A chat that blocks the bot is dropped from the list automatically.
#
# Notes:
# - Cron runs in UTC: '0 */2 * * *' = 03:30, 05:30, ... Tehran time.
# - GitHub may delay a scheduled run by a few minutes under load; for a
#   2-hourly digest that does not matter.
# - GitHub disables scheduled workflows after 60 days with no repo
#   activity; keep-alive.yml makes one trivial commit a month so the
#   schedule never pauses.
# - Secrets are encrypted and GitHub masks them in logs automatically.

name: Tr volume bot

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch:        # manual "Run workflow" button

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send volume digest
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          LCW_API_KEY: ${{ secrets.LCW_API_KEY }}
        run: python bot.py
      - name: Save subscriber list
        run: |
          git config user.name "tr-volume-bot"
          git config user.email "tr-volume-bot@indirect-b.is-a.dev"
          git add subscribers.json
          git diff --cached --quiet || git commit -m "Update subscribers"
          git push
